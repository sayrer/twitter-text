[package]
name = "twitter-text"
version = "0.2.0"
authors = ["Robert Sayre <sayrer@gmail.com>"]
readme = "README.md"
description = "An implementation of twitter-text in Rust."
license = "Apache-2.0"
repository = "https://github.com/sayrer/twitter-text"
edition = "2018"

[features]
ffi = []

[dependencies]
cxx = "=1.0.205"
unicode-normalization = "0.1.25"
idna = "1.1.0"
pest_derive = "2.9.3"
twitter_text_config = { path = "../config" , version = "0.2.0" }
twitter_text_parser = { path = "../parser" , version = "0.2.0" }
phf = { version = "0.14", features = ["macros", "unicase"] }
# Unicode/Emoji 18.0 support is on trunk but not yet released.
emojis = { git = "https://github.com/rossmacarthur/emojis", rev = "b2ccc65f43bf0a8d17a3ff681f7da4fb1387164e" }
memchr = "2.8"
nom = "8"
unicode_categories = "0.1"

# pest's default `std` feature pulls in stacker/psm, whose build script needs a
# C archiver that rules_rust cannot provide for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pest = "2.9.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
pest = { version = "2.9.3", default-features = false, features = ["memchr"] }
