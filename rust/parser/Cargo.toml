[package]
name = "twitter_text_parser"
version = "0.3.0"
authors = ["Robert Sayre <sayrer@gmail.com>"]
description = "Parser for twitter-text in Rust."
license = "Apache-2.0"
repository = "https://github.com/sayrer/twitter-text"
edition = "2018"

[dependencies]
pest_derive = "2.9.3"

# pest's default `std` feature pulls in stacker/psm, whose build script needs a
# C archiver that rules_rust cannot provide for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pest = "2.9.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
pest = { version = "2.9.3", default-features = false, features = ["memchr"] }

[lib]
doctest = false
test = false
