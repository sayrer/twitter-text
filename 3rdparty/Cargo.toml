[package]
name = "twitter_text_bindings_cargo"
version = "0.2.0"
authors = ["Robert Sayre <sayrer@gmail.com>"]
edition = "2021"

[dependencies]
clap = "4.6.7"
proc-macro-error = {version = "1.0.4"}
log = {version = "0.4.34", features = ["std"]}
cxx = "=1.0.205"
pest_derive = "2.9.3"
unicode-normalization = "0.1.25"
idna = "1.1.0"
lazy_static = "1.5.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
phf = { version = "0.14", features = ["macros", "unicase"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
pyo3-macros = "0.30"
magnus = "0.9.2"
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"

# pest's default `std` feature pulls in stacker/psm, whose build script needs a
# C archiver that rules_rust cannot provide for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pest = "2.9.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
pest = { version = "2.9.3", default-features = false, features = ["memchr"] }

[[bin]]
name = "fake_bin"
path = "fake_bin.rs"
